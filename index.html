<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!--
      CSP mínima válida também no desenvolvimento (ciclo S1). frame-src 'none': o único iframe do app é o
      srcdoc sandboxed dos widgets HTML (não sujeito a frame-src); qualquer tentativa desse frame de navegar
      para outro documento (fora da CSP do srcdoc) é bloqueada. A política completa do build público é
      aplicada pelos cabeçalhos da hospedagem e pelo plugin de build (ver docs/security/S1-HOSTING.md).
    -->
    <meta http-equiv="Content-Security-Policy" content="frame-src 'none'; object-src 'none'; base-uri 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1019" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Aurora Board</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
