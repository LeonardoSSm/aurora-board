name: CI

on:
  push:
    branches: [main, 'improvement/**', 'feature/**', 'security/**']
  pull_request:
  workflow_dispatch:

# Menor privilégio: só leitura do repositório. Nenhum job publica nada (sem deploy automático).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24
  # Nenhuma chave real: o bloco de IA deve aparecer como "não configurado" nos testes.
  OPENAI_API_KEY: ''
  ANTHROPIC_API_KEY: ''
  GEMINI_API_KEY: ''
  # D1: o binário do Electron (~100 MB) só é baixado nos jobs do desktop.
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

# Actions fixadas por SHA de commit (ciclo S1 — S1-SEC-017); o comentário indica a versão.
# Atualizações chegam pelo Dependabot (.github/dependabot.yml), revisadas em PR.
jobs:
  typecheck:
    name: Tipos (tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm run typecheck

  unit:
    name: Testes unitários (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm test -- --reporter=default --reporter=github-actions

  build:
    name: Build de produção (público)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm run build
      # O build público não pode conter depuração privilegiada, rotas da API local, source maps nem segredos.
      - name: Verificar o conteúdo do build público
        run: |
          set -e
          ! grep -rl "__aurora" dist/ || { echo "::error::window.__aurora presente no build público"; exit 1; }
          ! grep -rlE "/api/(ai|link-preview)" dist/ || { echo "::error::rotas /api no build público"; exit 1; }
          ! find dist -name "*.map" | grep . || { echo "::error::source maps no build público"; exit 1; }
          ! grep -rlE "(sk-(proj|ant)-[A-Za-z0-9_-]{16,}|sk-[A-Za-z0-9]{32,}|AIza[0-9A-Za-z_-]{30,})" dist/ || { echo "::error::possível segredo no build"; exit 1; }
          grep -q "Content-Security-Policy" dist/index.html
          test -f dist/_headers && test -f dist/sandbox.html
      - name: Configuração de hospedagem gerada está atualizada
        run: npx tsx scripts/generate-hosting-config.ts && git diff --exit-code -- public/_headers vercel.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: dist, path: dist, retention-days: 7 }

  audit:
    name: Segurança de dependências
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      # Bloqueia vulnerabilidades altas/críticas em dependências de produção.
      - run: npm audit --omit=dev --audit-level=high
      # Bloqueia vulnerabilidades críticas em qualquer dependência (ferramentas de build/teste incluídas).
      - run: npm audit --audit-level=critical
      # Relatório completo (informativo).
      - run: npm audit || true
      - name: Lockfile íntegro (npm ci falha se package.json e lockfile divergirem)
        run: npm ci --ignore-scripts

  secrets:
    name: Varredura de segredos (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: 'false'

  e2e:
    name: E2E (${{ matrix.project }})
    needs: [typecheck, unit]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # CI-1 (#25): os testes de navegador rodam na imagem oficial do Playwright, fixada por versão E digest.
    # Navegadores e dependências nativas já vêm nela — nada de `playwright install --with-deps` (apt) por
    # execução, que travava o WebKit (140 MB do espelho apt a ~50 kB/s → timeout). A versão TEM de ser a do
    # @playwright/test do lockfile (conferido em tests/unit/ci-workflow.test.ts e no passo "Navegadores da imagem").
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
      # uid do usuário 'runner' do host: workspace e HOME montados pertencem a ele (o Firefox não roda como
      # root com HOME de outro dono) e os testes não rodam como root.
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, mobile]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - name: Navegadores da imagem = versão do @playwright/test
        run: node scripts/ci/check-playwright-browsers.mjs ${{ matrix.project }}
      - run: npx playwright test --project=${{ matrix.project }}
        env: { CI: 'true' }
      - name: Artefatos de falha (relatório, traces, vídeos)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-${{ matrix.project }}
          path: |
            playwright-report
            test-results
          retention-days: 14

  static:
    name: Build público + CSP (${{ matrix.project }})
    needs: [typecheck, unit]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # CI-1 (#25): mesma imagem fixada do job e2e (ver o comentário lá).
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - name: Navegadores da imagem = versão do @playwright/test
        run: node scripts/ci/check-playwright-browsers.mjs ${{ matrix.project }}
      # Fase 1: CSP só como relatório (lista violações sem bloquear).
      - run: npx playwright test -c playwright.static.config.ts --project=${{ matrix.project }}
        env: { CI: 'true', AURORA_CSP_MODE: report-only }
      # Fase 2: CSP aplicada — é a configuração que vai para a hospedagem.
      - run: npx playwright test -c playwright.static.config.ts --project=${{ matrix.project }}
        env: { CI: 'true' }

  # D1 (#34) — Aurora Board Desktop. Os testes rodam no APLICATIVO ELECTRON (não no Vite): janela própria,
  # protocolo aurora://app, renderer sem Node, CSP, navegação/permissões bloqueadas, widget HTML isolado,
  # persistência do perfil depois de reabrir.
  desktop-linux:
    name: Desktop (Electron, Linux)
    needs: [typecheck, unit]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Mesma imagem fixada dos jobs e2e/static (dependências do Chromium e xvfb já incluídas; nada de apt).
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
      options: --user 1001
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: ''
      # O contêiner não oferece namespaces de usuário ao sandbox do SO; o sandbox do renderer continua ligado.
      AURORA_DESKTOP_NO_SANDBOX: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm run build:desktop
      - run: xvfb-run -a npx playwright test -c playwright.desktop.config.ts
        env: { CI: 'true' }
      - name: Artefatos de falha
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: desktop-linux-results, path: test-results, retention-days: 14 }

  desktop-windows:
    name: Desktop (Electron, Windows — app, pacote e instalador)
    needs: [typecheck, unit]
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm run build:desktop
      - name: Testes no app montado (Electron do projeto)
        run: npx playwright test -c playwright.desktop.config.ts
        env: { CI: 'true' }
      # D1-D: instalador NSIS (por usuário, sem administrador) + pasta; sem certificado = artefato “unsigned”.
      - name: Empacotar (instalador NSIS e pasta, sem assinatura)
        run: npx electron-builder --config electron-builder.yml --win --publish never
      - name: Testes no EXECUTÁVEL EMPACOTADO
        run: npx playwright test -c playwright.desktop.config.ts
        env: { CI: 'true', AURORA_DESKTOP_EXECUTABLE: '${{ github.workspace }}/release/win-unpacked/Aurora Board.exe' }
      - name: Instalar, abrir, desinstalar (máquina descartável da CI)
        shell: pwsh
        run: |
          $installer = (Get-ChildItem release -Filter 'Aurora-Board-*-win-x64-unsigned.exe').FullName
          if (-not $installer) { throw 'instalador não gerado' }
          $env:AURORA_DESKTOP_INSTALLER = $installer
          npx playwright test -c playwright.desktop.config.ts e2e-desktop/install.spec.ts
        env: { CI: 'true', AURORA_INSTALL_TEST: '1' }
      - name: Instalador (artefato de teste, NÃO assinado)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: aurora-board-windows-x64-unsigned, path: 'release/Aurora-Board-*-win-x64-unsigned.exe', retention-days: 14, if-no-files-found: error }
      - name: Artefatos de falha
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: desktop-windows-results, path: test-results, retention-days: 14 }

  desktop-linux-package:
    name: Desktop (Linux — AppImage e .deb instalados)
    needs: [typecheck, unit]
    # Host (não contêiner): instalar o .deb exige root, e o sandbox do Chromium usa o que o pacote configura
    # (perfil AppArmor no Ubuntu 24+ ou, sem namespaces de usuário, o auxiliar SUID).
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm run build:desktop
      - name: Empacotar (AppImage e .deb, sem assinatura)
        run: npx electron-builder --config electron-builder.yml --linux --publish never
      - name: Metadados do .deb
        run: |
          set -e
          DEB=$(ls release/Aurora-Board-*-linux-amd64-unsigned.deb)
          dpkg-deb --info "$DEB"
          dpkg-deb --contents "$DEB" > deb-contents.txt
          grep 'opt/Aurora Board/aurora-board' deb-contents.txt
          dpkg-deb --field "$DEB" Depends Recommends
      - name: Instalar o .deb (como no Linux Mint) e testar o app INSTALADO, sem root
        run: |
          set -e
          sudo dpkg -i release/Aurora-Board-*-linux-amd64-unsigned.deb
          # Sandbox configurado pela pós-instalação: SUID (sem namespaces) OU perfil AppArmor (Ubuntu 24+) OU namespaces livres.
          ls -l '/opt/Aurora Board/chrome-sandbox'
          test -u '/opt/Aurora Board/chrome-sandbox' || test -f /etc/apparmor.d/aurora-board || unshare --user true
          xvfb-run -a npx playwright test -c playwright.desktop.config.ts
        env: { CI: 'true', AURORA_INSTALL_TEST: '1', AURORA_DESKTOP_EXECUTABLE: '/opt/Aurora Board/aurora-board' }
      # AppImage: sem FUSE no runner (extrai e roda). Sandbox por namespaces de usuário, liberados como em
      # distribuições sem a restrição do AppArmor do Ubuntu 24.04 (ver docs/desktop/TROUBLESHOOTING.md).
      - name: AppImage (extrai e roda, com sandbox por namespaces)
        run: |
          set -e
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          APP=$(ls release/Aurora-Board-*-linux-x86_64-unsigned.AppImage)
          chmod +x "$APP"
          AURORA_DESKTOP_EXECUTABLE="$PWD/$APP" xvfb-run -a npx playwright test -c playwright.desktop.config.ts e2e-desktop/desktop.spec.ts
        env: { CI: 'true', APPIMAGE_EXTRACT_AND_RUN: '1' }
      - name: Pacotes (artefatos de teste, NÃO assinados)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aurora-board-linux-x64-unsigned
          path: |
            release/Aurora-Board-*-linux-x86_64-unsigned.AppImage
            release/Aurora-Board-*-linux-amd64-unsigned.deb
          retention-days: 14
          if-no-files-found: error
      - name: Artefatos de falha
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: desktop-linux-package-results, path: test-results, retention-days: 14 }
