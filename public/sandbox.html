<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <!--
      Documento hospedeiro dos widgets HTML (ciclo S1). É carregado SOMENTE como
      <iframe sandbox="allow-scripts" src="/sandbox.html"> (origem opaca). Por ser um documento próprio,
      não herda a CSP do app (um srcdoc herdaria e bloquearia os scripts dos widgets); a política abaixo
      também é enviada como cabeçalho pela hospedagem (hosting/headers.ts › SANDBOX_DOCUMENT_CSP).
      Sem rede, sem frames, sem formulários, sem base, sem objetos.

      HTML Data Bridge (issue #11, protocolo 1) — API exposta ao HTML do usuário:
        aurora.protocol            → 1
        aurora.state               → estado persistido (preferências/filtros; gravado no quadro)
        aurora.setState(obj)       → grava o estado persistido (até 100 KB)
        aurora.ports               → { inputs: [{id,label,type}], outputs: [...] } declarados no bloco
        aurora.inputs              → { porta: valor } (só leitura; primeiro valor de cada entrada ou null)
        aurora.connections         → { porta: [{ source, port, value }] } (todas as conexões de cada entrada)
        aurora.onInputs(cb)        → chama cb(inputs, connections) agora e a cada mudança; devolve “cancelar”
        aurora.publish(porta, v)   → publica uma SAÍDA declarada (validada pelo host; não é gravada no quadro)
      Eventos: 'aurora:init' (estado), 'aurora:inputs' (detail = { inputs, connections }).
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; media-src data: blob:; base-uri 'none'; form-action 'none'; frame-src 'none'; object-src 'none'" />
    <meta name="referrer" content="no-referrer" />
    <!-- Sem resolução antecipada de DNS a partir de links do HTML do usuário (canal lateral fora da CSP). -->
    <meta http-equiv="x-dns-prefetch-control" content="off" />
    <style>body{margin:0;font:13px system-ui,sans-serif;color:#e6ecf6;background:transparent}</style>
    <script>
      (function () {
        // Recusa-se a funcionar fora de um iframe sandboxed (sem allow-same-origin): aberto como página, ou
        // num iframe comum, este documento teria a origem do app — então não executa nada.
        if (self.origin !== 'null' || window.parent === window) {
          document.documentElement.setAttribute('data-sandbox-refused', '1');
          return;
        }
        // WebRTC não é coberto pela CSP (connect-src): um HTML poderia vazar dados por ICE/STUN. Com a ponte de
        // dados (issue #11) o HTML pode receber dados financeiros, então as APIs somem ANTES do código do usuário.
        ['RTCPeerConnection', 'webkitRTCPeerConnection', 'mozRTCPeerConnection', 'RTCDataChannel', 'RTCSessionDescription', 'RTCIceCandidate', 'RTCRtpSender', 'RTCRtpReceiver', 'RTCRtpTransceiver', 'RTCDtlsTransport', 'RTCIceTransport', 'RTCSctpTransport', 'RTCCertificate'].forEach(function (n) {
          try { delete window[n]; } catch (err) { /* não configurável */ }
          try { Object.defineProperty(window, n, { value: undefined, writable: false, configurable: false }); } catch (err) { /* já removido */ }
        });
        var loaded = false;
        var token = '';
        var ports = Object.freeze({ inputs: Object.freeze([]), outputs: Object.freeze([]) });
        var inputs = Object.freeze({});
        var connections = Object.freeze({});
        var callbacks = [];

        function freeze(o) {
          if (o && typeof o === 'object' && !Object.isFrozen(o)) {
            Object.freeze(o);
            Object.keys(o).forEach(function (k) { freeze(o[k]); });
          }
          return o;
        }
        function post(msg) {
          try { parent.postMessage(msg, '*'); }
          catch (err) { console.warn('[aurora] valor não pôde ser enviado (use JSON simples):', err && err.name); }
        }
        function emitInputs() {
          var list = callbacks.slice();
          for (var i = 0; i < list.length; i++) {
            try { list[i](inputs, connections); } catch (err) { console.error(err); }
          }
          window.dispatchEvent(new CustomEvent('aurora:inputs', { detail: { inputs: inputs, connections: connections } }));
        }
        function setInputs(b) {
          inputs = freeze(b && b.inputs && typeof b.inputs === 'object' ? b.inputs : {});
          connections = freeze(b && b.connections && typeof b.connections === 'object' ? b.connections : {});
        }

        var api = {
          protocol: 1,
          state: null,
          setState: function (s) { post({ type: 'aurora:setState', token: token, state: s }); },
          publish: function (port, value) { post({ type: 'aurora:publish', token: token, port: String(port), value: value }); },
          onInputs: function (cb) {
            if (typeof cb !== 'function') return function () {};
            callbacks.push(cb);
            try { cb(inputs, connections); } catch (err) { console.error(err); }
            return function () { var i = callbacks.indexOf(cb); if (i >= 0) callbacks.splice(i, 1); };
          },
        };
        Object.defineProperty(api, 'inputs', { get: function () { return inputs; }, enumerable: true });
        Object.defineProperty(api, 'connections', { get: function () { return connections; }, enumerable: true });
        Object.defineProperty(api, 'ports', { get: function () { return ports; }, enumerable: true });
        window.aurora = api;

        window.addEventListener('message', function (e) {
          if (e.source !== window.parent || !e.data || typeof e.data !== 'object') return;
          if (e.data.type === 'aurora:load' && !loaded && typeof e.data.html === 'string') {
            loaded = true;
            api.state = e.data.state === undefined ? null : e.data.state;
            var b = e.data.bridge;
            if (b && typeof b === 'object') {
              token = typeof b.token === 'string' ? b.token : '';
              ports = freeze({ inputs: Array.isArray(b.ports && b.ports.inputs) ? b.ports.inputs : [], outputs: Array.isArray(b.ports && b.ports.outputs) ? b.ports.outputs : [] });
              setInputs(b);
            }
            var tpl = document.createElement('template');
            tpl.innerHTML = e.data.html;
            document.body.appendChild(tpl.content);
            // Scripts vindos de innerHTML não executam: recria cada um, em ordem (só inline — a CSP bloqueia src).
            var scripts = document.body.querySelectorAll('script');
            for (var i = 0; i < scripts.length; i++) {
              var old = scripts[i];
              var s = document.createElement('script');
              if (old.type) s.type = old.type;
              s.textContent = old.textContent;
              old.replaceWith(s);
            }
            document.dispatchEvent(new Event('DOMContentLoaded'));
            window.dispatchEvent(new CustomEvent('aurora:init', { detail: api.state }));
            if (b && typeof b === 'object') window.dispatchEvent(new CustomEvent('aurora:inputs', { detail: { inputs: inputs, connections: connections } }));
          } else if (e.data.type === 'aurora:init') {
            api.state = e.data.state;
            window.dispatchEvent(new CustomEvent('aurora:init', { detail: e.data.state }));
          } else if (e.data.type === 'aurora:inputs' && loaded && e.data.token === token && token) {
            setInputs(e.data);
            emitInputs();
          }
        });
      })();
    </script>
  </head>
  <body></body>
</html>
